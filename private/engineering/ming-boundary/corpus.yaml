# corpus.yaml — 语言前端质量语料注册表（metrics.mjs 消费，frontend-quality-gate.md M1-M8 语料层）
# path：绝对路径原样用；相对路径相对 MB_CORPUS_ROOT 环境变量解析（跨机/测试注入面）
# minParseRate：M1 门——剔除 errFixtureGlobs 命中文件后的解析成功率下限
# errFixtureGlobs：仓自带故意残缺固件目录（正则串，匹配归一化 / 路径）
# maxMalformed：M4 门——畸形名（{}/换行/注释残渣）上限
# fixtures（可选）：M7 采收断言——match=仓相对路径正则选件，
#   minFiles(缺省1,零命中=固件漂移FAIL)/minImports/minDecls/maxMalformed(缺省0)
version: 1
langs:
  rust:
    corpora:
      # repo/rev 可选——带 repo 的语料由 metrics.mjs --sync 物化+钉 rev 校验漂移；
      # 无 repo 的本地语料只量不拉（测试 fixture/手写语料面）
      - name: fd
        path: fd-small
        repo: sharkdp/fd
        rev: ce97e473ebaec49697c07daa50a7bc2b32f713d2
        scale: small
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: ripgrep
        path: ripgrep-med
        repo: BurntSushi/ripgrep
        rev: 3fce3b5bb0236da2df6d99672afb8a719642eca7
        scale: med
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: rust-analyzer
        path: ra-large
        repo: rust-lang/rust-analyzer
        rev: 03fcb77246f2568adb0e9b2fa60d19c6cc1686f4
        scale: large
        minParseRate: 0.99
        maxMalformed: 2
        errFixtureGlobs: ['test_data/', 'fixtures/']
        # M7 上游固件采收：match=仓相对路径正则，逐件断言产边/decl/零畸形名
        # （固件内 use 目标不存在磁盘——edge 落 external/unresolved 属预期，断产边不断死）
        fixtures:
          - match: 'test_data/parser/inline/ok/use_tree'
            minImports: 1
            maxMalformed: 0
          - match: 'test_data/parser/inline/ok/(const_item|mod_item|mod_item_curly|macro_rules_as_macro_name)\.rs'
            minDecls: 1
            maxMalformed: 0
      - name: tach
        path: tach
        repo: gauge-sh/tach
        rev: 08411d489946d8fa10c3bc5957864ea63fa1c3c8
        scale: med
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
        # 双语言同构件仓（src/=Rust 核 89件 + python/=绑定 167件）——
        # 同仓同时进 rust/python 两语料段，压双前端一致性
  python:
    corpora:
      - name: requests
        path: py-requests
        repo: psf/requests
        rev: 611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60
        scale: small
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: flask
        path: py-flask
        repo: pallets/flask
        rev: d73fa1cdcbd8b1465c151db8924ba58b1dd14e35
        scale: med
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: black
        path: py-black
        repo: psf/black
        rev: 994ef7eeb18172178552daa1f36f001d156ad583
        scale: large
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: ['tests/data/']
        # M7 采收：tests/data/cases 上游格式化奇形件——但挑语法面实产族
        # （import_* 相对星导入/括号 from；assign/function/class decl 族）
        fixtures:
          - match: 'tests/data/cases/(fmtpass_imports|import_line_collapse|import_spacing|line_ranges_imports)\.py'
            minImports: 1
            maxMalformed: 0
          - match: 'tests/data/cases/(annotated_assignment_target_parens|annotations|function|class_blank_parentheses|type_param_defaults)\.py'
            minDecls: 1
            maxMalformed: 0
      - name: django
        path: py-django
        repo: django/django
        rev: 80ea222c8af501031b2eae4f7d9fdbf16cb507a7
        scale: large
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: ['tests/']
      - name: typeshed
        path: py-typeshed
        repo: python/typeshed
        rev: b932d8ce0f893d7d9ef167f0379dcaf9f48bf70b
        scale: large
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: ['stdlib/@tests/']
      - name: tach
        path: tach
        repo: gauge-sh/tach
        rev: 08411d489946d8fa10c3bc5957864ea63fa1c3c8
        scale: med
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: ['tests/']
  js:
    corpora:
      - name: express
        path: js-express
        repo: expressjs/express
        rev: 7ef98448f8b38099ab1ded55e458538ad47a51e7
        scale: small
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: ['test/', 'examples/']
      - name: solid
        path: js-solid
        repo: solidjs/solid
        rev: b25c557754f2ced0d86490e6dbfded9b1745b663
        scale: med
        # 实欠 1 件：signal.ts `Setter<in out T>`——ast-grep 0.45.3 捆绑的
        # tree-sitter-typescript 不认 TS4.7 variance 注解（最小件实证），
        # 属上游 grammar 版本缺口非路由缺陷；升 ast-grep 后可回拉 1.0
        minParseRate: 0.99
        maxMalformed: 0
        errFixtureGlobs: ['test/', 'packages/*/test', 'bench/', 'examples/']
      - name: vite
        path: js-vite
        repo: vitejs/vite
        rev: 10033218d239c927cdc375970b5741cce408e81b
        scale: large
        minParseRate: 1.0
        maxMalformed: 0
        # 前两条=故意脏件区；后四条=ast-grep 0.45.3 捆绑 tree-sitter-typescript
        # 语法版本缺口实证：export type * as ns(TS5.0)×2 / typeof import()泛型实参 /
        # .d.ts 多行泛型列表——文件级精准豁免，升 ast-grep 后逐条复核
        errFixtureGlobs: ['playground/', '__tests__/fixtures', 'src/node/index\.ts$', 'runnerImport\.spec\.ts$', 'types/importGlob\.d\.ts$', 'terserOptions\.d\.ts$']
