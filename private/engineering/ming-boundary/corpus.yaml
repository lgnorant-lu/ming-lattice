# corpus.yaml — 语言前端质量语料注册表（metrics.mjs 消费，frontend-quality-gate.md M1-M8 语料层）
# path：绝对路径原样用；相对路径相对 MB_CORPUS_ROOT 环境变量解析（跨机/测试注入面）
# minParseRate：M1 门——剔除 errFixtureGlobs 命中文件后的解析成功率下限
# errFixtureGlobs：仓自带故意残缺固件目录（正则串，匹配归一化 / 路径）
# maxMalformed：M4 门——畸形名（{}/换行/注释残渣）上限
version: 1
langs:
  rust:
    corpora:
      # repo/rev 可选——带 repo 的语料由 metrics.mjs --sync 物化+钉 rev 校验漂移；
      # 无 repo 的本地语料只量不拉（测试 fixture/手写语料面）
      - name: fd
        path: fd-small
        repo: sharkdp/fd
        rev: ce97e473ebaec49697c07daa50a7bc2b32f713d2
        scale: small
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: ripgrep
        path: ripgrep-med
        repo: BurntSushi/ripgrep
        rev: 3fce3b5bb0236da2df6d99672afb8a719642eca7
        scale: med
        minParseRate: 1.0
        maxMalformed: 0
        errFixtureGlobs: []
      - name: rust-analyzer
        path: ra-large
        repo: rust-lang/rust-analyzer
        rev: 03fcb77246f2568adb0e9b2fa60d19c6cc1686f4
        scale: large
        minParseRate: 0.99
        maxMalformed: 2
        errFixtureGlobs: ['test_data/', 'fixtures/']
