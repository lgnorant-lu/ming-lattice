# ming-skills 单一事实源 (Single Source of Truth) v1.1
# sync.ps1 / update.ps1 / lint.ps1 均从此文件读取。修改部署/启用状态请只改此文件。
#
# v1.1 变更（全局版本管理设计）：
#   - updatePolicy: 更新检测策略（TTL 内缓存命中 → 零网络）
#   - 每个 vertical 条目: pin(本地内容对应 upstream commit) + acquiredAt(采集日期)
#     + checkCache(lastCheckedAt/lastRemoteHead, 由 update.ps1 维护)
#   - vertical/ 为物化区：远端仅存索引，字节由 scripts/fetch.mjs 按 pin 物化（.git 随之建立），update.ps1 用 git fetch 增量检测
#     无需每次全量计算
#
# 字段说明:
#   targets     : 目标客户端部署根目录（key = 客户端名, value = 目录绝对路径）
#   updatePolicy: { ttlDays: 缓存有效天数, fetchMode: 元数据拉取模式 }
#   base        : 基座（submodule 跟踪 upstream, 按模块部署）; pin = commit SHA
#   vertical    : 垂直参考（物化区, fetch.mjs 按需建 .git）; pin = upstream commit(全 40 位)
#     domain    : 资产域（合法值域见下方 domains: 登记表——新值先入表再使用）
#     deploy    : 部署映射 { 客户端: bool }（空 = 仅参考不部署）
#     weight    : 物化权重——core=默认物化(缺省) / heavy=重仓不进默认面(仅 fetch --only/--include-heavy 可达)
#     kind      : 资产类别——缺省=skill（受 SKILL.md/frontmatter 契约约束）；
#                 tool|asset=非技能运营资产（host-tools 先例：登记为目录归属/索引对账，
#                 check-skill --all 豁免 SKILL.md 契约；新类别值先在此说明再使用）

schemaVersion: "1.1"
description: "ming-skills 单一事实源：源 → 本地路径 → 版本记录 → 部署目标"

updatePolicy:
  ttlDays: 7            # checkCache 有效天数; 有效期内 update.ps1 不发起网络请求
  fetchMode: blob:none  # vendored .git 元数据模式（commit/tree, 不含 blob）
targets:
  claude: "%USERPROFILE%/.cc-switch/skills"   # env 占位由 sync.ps1 展开——SoT 不烙本机路径
  # codex: "%USERPROFILE%/.codex/skills"      # 需要时启用并安装对应客户端

# 层别登记表（元组管理）——SKILL.md metadata.layer 的合法值域。
# 新类别先入此表再使用；check-skill 对未登记值告警。ming-* 前缀另须条目级 metaSystem: true 声明。
layers:
  - methodology        # 方法/流程元规则
  - architecture       # 架构边界元规则
  - testing            # 测试域
  - knowledge-paradigm # 领域知识范式
  - infrastructure     # 基础设施/路由自身
  - documentation      # 文档体裁/排版
  - security           # 安全元规则
  - observability      # 可观测
  - quality-overlay    # 质量横切 overlay
  - data-contract      # 数据契约演进
  - config             # 配置归一化
  - meta               # 元系统自身（distiller 等）

# 资产域登记表——条目级 domain: 字段的合法值域（与 layers: 同构，先入表再使用）。
# 词表只登记通用类型轴——生态/来源特征不入值（ruyi 系已由 ruyi/web 归并 web/mcp，
# 来源轴由 name/repo/note 承载）。web/js、android/apk 近义重叠归并裁决另案。
# 三词表分轴防撞（同名不同词表）：本表=资产域（条目 domain:）；上方 layers:=包分类（SKILL.md
# metadata.layer）；docs frontmatter domain:=文档归属（ming.yaml domains+audit-domains 治理）。
domains:
  - js          # Web/JS 逆向
  - bin         # 二进制
  - apk         # Android APK 逆向
  - ios         # iOS
  - kb          # 知识库
  - ctf         # CTF
  - mw          # 恶意软件
  - misc        # 其他
  - mcp         # MCP 服务器/插件源码
  - web         # Web 对抗面（自动化/指纹/反检测；与 js 近义——归并候审）
  - mp          # 小程序
  - android     # Android 工具链（非 APK 逆向；与 apk 近义——归并候审）
  - routing     # 路由基础设施
  - engineering # 工程范式族（meta-rules/paradigm 件——private/engineering/ 命名词表）

