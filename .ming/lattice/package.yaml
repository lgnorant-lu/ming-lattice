# .ming/lattice/package.yaml — 本箱身份 manifest（包名/版本/种类/成员约定）
#
# 分工铁律（SoT 各司其职，指针互委，不双写）：
#   ../../ming.yaml   : 伞面——ming 命名域 scope/命名谱/kind 词表/项目登记
#   本文件            : "lattice 箱是什么"——包身份、成员约定、SoT 指针
#   registry.yaml     : 单元账——采集/pin/层别/部署映射/词表登记
#   docs/ming.yaml    : 文档域治理账——Ming-L 九域动力学
#
# 演进纪律（contract-core-paradigm）：只加字段不改义；manifestVersion 升位=破坏性变更。
# 校验面：scripts/check-ming.mjs（经伞面 projects 登记定位本文件）

manifestVersion: "1"
name: ming-lattice
version: "0.1.0"
kind: lattice              # 词表归伞面 .ming/ming.yaml kinds: 登记
description: "Ming-Lattice — 技能集散与工程中枢主箱：私有包/参考层/部署投影/门禁 kit 的一体化治理格"

naming:
  prefix: "ming-"          # 与伞面 naming.prefix 一致性由 check-ming 对账

packages:
  # 约定即成员（workspace glob 先例）——匹配到的目录即子包，无花名册漂移。
  # 新增 ming-* 包只需落在 glob 面内 + registry private 登记 metaSystem: true。
  members:
    - "private/ming-*"
    - "private/engineering/ming-*"

sources:
  registry: "registry.yaml"      # 单元/层/部署/采集 SoT
  docDomains: "docs/ming.yaml"   # 文档域治理 SoT
